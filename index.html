<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f766e" />
<title>Copiloto Pré-Op</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50">
<div id="root"></div>

  window.SUPABASE_ANON_KEY = "sb_publishable_DHhJTH3U2U7rHlHMsZZGZw_hEY-4USm";

<script>
  // Se algo falhar ao iniciar, mostra a mensagem na tela em vez de ficar em branco.
  window.addEventListener("error", function (e) {
    var r = document.getElementById("root");
    if (r && !r.hasChildNodes()) {
      r.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#b91c1c;font-size:14px">Erro ao carregar o app: ' + (e.message || e) + '</div>';
    }
  });
</script>

<script type="text/plain" id="appsrc">
const { useState, useMemo, useEffect } = React;
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const COMORB = [["has","HAS"],["dm2","DM2"],["drc","DRC"],["coronario","Coronariopatia"],["ic","Insuf. cardíaca"],["fa","Fibrilação atrial"],["aos","AOS conhecida"],["hepato","Hepatopatia"],["pneumo","Asma / DPOC"],["tireoide","Tireoidopatia"]];
const input = "w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 focus:outline-none";
const num = (v) => (v === "" || v == null ? NaN : Number(v));

function Meter({ title, big, unit, band, note, segments, segActive }) {
  const tones = { low:"text-emerald-700 bg-emerald-50 border-emerald-200", mid:"text-amber-700 bg-amber-50 border-amber-200", high:"text-red-700 bg-red-50 border-red-200", none:"text-slate-500 bg-slate-50 border-slate-200" };
  const fills = { low:"bg-emerald-500", mid:"bg-amber-500", high:"bg-red-500", none:"bg-slate-300" };
  return (
    <div className={"rounded-lg border p-4 " + tones[band.tone]}>
      <div className="flex items-baseline justify-between">
        <span className="text-[11px] font-semibold uppercase tracking-wider opacity-80">{title}</span>
        <span className="text-xs font-medium">{band.label}</span>
      </div>
      <div className="mt-1 flex items-baseline gap-1"><span className="font-mono text-3xl font-bold tabular-nums">{big}</span><span className="text-sm opacity-70">{unit}</span></div>
      {segments != null && <div className="mt-2 flex gap-1">{Array.from({length:segments}).map((_,i)=><span key={i} className={"h-1.5 flex-1 rounded-full " + (i<segActive?fills[band.tone]:"bg-white/60")} />)}</div>}
      {note && <p className="mt-2 text-xs leading-snug opacity-80">{note}</p>}
    </div>
  );
}

function Auth() {
  const [email,setEmail]=useState(""); const [senha,setSenha]=useState(""); const [modo,setModo]=useState("entrar");
  const [msg,setMsg]=useState(""); const [busy,setBusy]=useState(false);
  async function go(){
    setBusy(true); setMsg("");
    const fn = modo==="entrar" ? sb.auth.signInWithPassword({email,password:senha}) : sb.auth.signUp({email,password:senha});
    const { error } = await fn;
    if (error) setMsg(error.message);
    else if (modo==="criar") setMsg("Conta criada. Se pedir, confirme o e-mail e entre.");
    setBusy(false);
  }
  return (
    <div className="mx-auto mt-16 max-w-sm px-4">
      <div className="mb-6 text-center"><h1 className="text-2xl font-bold tracking-tight text-slate-900">Copiloto Pré-Op</h1><p className="text-sm text-slate-500">Acesso restrito</p></div>
      <div className="space-y-3 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <input className={input} type="email" placeholder="e-mail" value={email} onChange={e=>setEmail(e.target.value)} />
        <input className={input} type="password" placeholder="senha" value={senha} onChange={e=>setSenha(e.target.value)} />
        <button onClick={go} disabled={busy||!email||!senha} className="w-full rounded-md bg-teal-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-teal-800 disabled:bg-slate-300">{busy?"…":(modo==="entrar"?"Entrar":"Criar conta")}</button>
        {msg && <p className="text-xs text-slate-500">{msg}</p>}
        <button onClick={()=>setModo(modo==="entrar"?"criar":"entrar")} className="w-full text-xs text-teal-700">{modo==="entrar"?"Criar uma conta":"Já tenho conta"}</button>
      </div>
    </div>
  );
}

function Avaliacao({ session }) {
  const [p,setP]=useState({codigo:"",idade:"",sexo:"M",altura:"",peso:"",medicacoes:"",exHb:"",exCr:"",exTfg:"",exHba1c:"",exK:"",exInr:"",exLivre:"",funcional:"desconhecido",ronco:false,cansaco:false,apneiaObs:false,pescoco:false,tumConc:"0.1",tumVol:"",tumTeto:""});
  const [comorb,setComorb]=useState({}); const [usarBusca,setUsarBusca]=useState(true);
  const [loading,setLoading]=useState(false); const [erro,setErro]=useState(""); const [laudo,setLaudo]=useState(""); const [salvo,setSalvo]=useState(false);
  const set=(k,v)=>setP(s=>({...s,[k]:v}));

  const imc=useMemo(()=>{const h=num(p.altura)/100,w=num(p.peso);return h>0&&w>0?w/(h*h):NaN;},[p.altura,p.peso]);
  const stop=useMemo(()=>{const it={S:p.ronco,T:p.cansaco,O:p.apneiaObs,P:!!comorb.has,B:imc>35,A:num(p.idade)>50,N:p.pescoco,G:p.sexo==="M"};const s=Object.values(it).filter(Boolean).length;let band={label:"—",tone:"none"};if(p.idade!==""){band=s<=2?{label:"Baixo",tone:"low"}:s<=4?{label:"Intermediário",tone:"mid"}:{label:"Alto",tone:"high"};}return{it,s,band};},[p.ronco,p.cansaco,p.apneiaObs,p.pescoco,p.sexo,p.idade,comorb.has,imc]);
  const last=useMemo(()=>{const c=num(p.tumConc),v=num(p.tumVol),w=num(p.peso),t=num(p.tumTeto);if(!(c>0&&v>0&&w>0))return{ok:false};const tot=v*c*10,mgkg=tot/w;let band;if(mgkg<=7)band={label:"≤ clássico",tone:"low"};else if(mgkg<=(t>0?t:35))band={label:t>0?"≤ teto":"> clássico",tone:"mid"};else band={label:"> teto",tone:"high"};return{ok:true,tot,mgkg,band};},[p.tumConc,p.tumVol,p.peso,p.tumTeto]);

  function montarDados(){
    const co=COMORB.filter(([k])=>comorb[k]).map(([,l])=>l);
    const ex=[p.exHb&&`Hb ${p.exHb}`,p.exCr&&`Cr ${p.exCr}`,p.exTfg&&`TFG ${p.exTfg}`,p.exHba1c&&`HbA1c ${p.exHba1c}`,p.exK&&`K ${p.exK}`,p.exInr&&`INR ${p.exInr}`,p.exLivre].filter(Boolean).join("; ");
    const fmap={ge4:"≥4 METs",lt4:"<4 METs (dispneia leve)",desconhecido:"não avaliada"};
    return `PACIENTE (pseudonimizado, código ${p.codigo||"?"})
Idade ${p.idade||"?"} | Sexo ${p.sexo} | Peso ${p.peso||"?"} kg | IMC ${Number.isFinite(imc)?imc.toFixed(1):"?"}
Comorbidades: ${co.join(", ")||"nenhuma referida"}
Capacidade funcional: ${fmap[p.funcional]}
Medicações:\n${p.medicacoes.trim()||"(não informadas)"}
Exames: ${ex||"(não informados)"}
CÁLCULOS: STOP-BANG ${stop.s}/8 (${stop.band.label}); LAST ${last.ok?last.mgkg.toFixed(1)+" mg/kg":"insuf."}`;
  }

  async function gerar(){
    setErro(""); setLaudo(""); setSalvo(false); setLoading(true);
    try{
      const { data:{ session: s } } = await sb.auth.getSession();
      const r=await fetch("/api/avaliar",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${s.access_token}`},body:JSON.stringify({dados:montarDados(),usarBusca})});
      const j=await r.json();
      if(!r.ok) throw new Error(j.error||"Falha");
      setLaudo(j.laudo);
    }catch(e){ setErro(e.message+' — se persistir, desmarque "Confirmar na fonte".'); }
    finally{ setLoading(false); }
  }

  async function salvar(){
    if(!p.codigo.trim()){ setErro("Defina um código para o caso antes de salvar."); return; }
    const { error } = await sb.from("casos").insert({
      user_id: session.user.id, codigo:p.codigo.trim(), idade:num(p.idade)||null, sexo:p.sexo,
      dados:{ comorbidades:COMORB.filter(([k])=>comorb[k]).map(([,l])=>l), imc:Number.isFinite(imc)?+imc.toFixed(1):null, stopbang:stop.s, last:last.ok?+last.mgkg.toFixed(1):null }, laudo
    });
    if(error) setErro(error.message); else { setSalvo(true); }
  }

  const tag=(laudo.match(/\[(APTO|OTIMIZAR|ADIAR|ESCALAR)\]/)||[])[1];
  const tagCls={APTO:"bg-emerald-50 border-emerald-200 text-emerald-800",OTIMIZAR:"bg-amber-50 border-amber-200 text-amber-800",ADIAR:"bg-red-50 border-red-200 text-red-800",ESCALAR:"bg-red-50 border-red-200 text-red-800"}[tag]||"";
  const podeGerar=p.idade!==""&&p.peso!==""&&!loading;

  return (
    <div className="grid grid-cols-1 gap-6 lg:grid-cols-12">
      <div className="lg:col-span-7">
        <div className="space-y-5 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
          <div>
            <label className="block text-sm text-slate-600 mb-1">Código do caso <span className="text-xs text-slate-400">(iniciais/apelido — nunca o nome)</span></label>
            <input className={input} value={p.codigo} onChange={e=>set("codigo",e.target.value)} placeholder="ex.: MJ-67" />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="block text-sm text-slate-600 mb-1">Idade</label><input className={input} inputMode="numeric" value={p.idade} onChange={e=>set("idade",e.target.value)} /></div>
            <div><label className="block text-sm text-slate-600 mb-1">Sexo</label><select className={input} value={p.sexo} onChange={e=>set("sexo",e.target.value)}><option value="M">Masculino</option><option value="F">Feminino</option><option value="outro">Outro</option></select></div>
            <div><label className="block text-sm text-slate-600 mb-1">Altura (cm)</label><input className={input} inputMode="numeric" value={p.altura} onChange={e=>set("altura",e.target.value)} /></div>
            <div><label className="block text-sm text-slate-600 mb-1">Peso (kg)</label><input className={input} inputMode="numeric" value={p.peso} onChange={e=>set("peso",e.target.value)} /></div>
          </div>
          {Number.isFinite(imc)&&<p className="text-xs text-slate-500">IMC <span className="font-mono font-semibold">{imc.toFixed(1)}</span></p>}
          <div>
            <p className="text-sm text-slate-600 mb-2">Comorbidades</p>
            <div className="flex flex-wrap gap-2">{COMORB.map(([k,l])=><button key={k} onClick={()=>setComorb(s=>({...s,[k]:!s[k]}))} className={"rounded-full border px-3 py-1.5 text-sm "+(comorb[k]?"border-teal-600 bg-teal-50 text-teal-800":"border-slate-300 text-slate-600")}>{l}</button>)}</div>
          </div>
          <div><label className="block text-sm text-slate-600 mb-1">Medicações (uma por linha)</label><textarea className={input+" min-h-[80px] font-mono text-xs"} value={p.medicacoes} onChange={e=>set("medicacoes",e.target.value)} /></div>
          <div>
            <p className="text-sm text-slate-600 mb-2">Exames</p>
            <div className="grid grid-cols-3 gap-3">
              {[["exHb","Hb"],["exCr","Creatinina"],["exTfg","TFG"],["exHba1c","HbA1c"],["exK","K⁺"],["exInr","INR"]].map(([k,l])=><div key={k}><label className="block text-xs text-slate-500 mb-1">{l}</label><input className={input} value={p[k]} onChange={e=>set(k,e.target.value)} /></div>)}
            </div>
            <input className={input+" mt-3"} placeholder="outros achados" value={p.exLivre} onChange={e=>set("exLivre",e.target.value)} />
          </div>
          <div><label className="block text-sm text-slate-600 mb-1">Capacidade funcional</label><select className={input} value={p.funcional} onChange={e=>set("funcional",e.target.value)}><option value="ge4">≥4 METs — sobe escada sem sintoma</option><option value="lt4">&lt;4 METs — dispneia leve</option><option value="desconhecido">Não avaliada</option></select></div>
          <div>
            <p className="text-sm text-slate-600 mb-2">STOP-BANG (marque os presentes)</p>
            <div className="flex flex-wrap gap-2">{[["ronco","Ronco"],["cansaco","Sonolência"],["apneiaObs","Apneia observada"],["pescoco","Pescoço ≥40cm"]].map(([k,l])=><button key={k} onClick={()=>set(k,!p[k])} className={"rounded-full border px-3 py-1.5 text-sm "+(p[k]?"border-teal-600 bg-teal-50 text-teal-800":"border-slate-300 text-slate-600")}>{l}</button>)}</div>
            <p className="text-xs text-slate-400 mt-1">HAS, IMC&gt;35, idade&gt;50 e sexo masculino entram sozinhos.</p>
          </div>
          <div>
            <p className="text-sm text-slate-600 mb-2">Tumescente (LAST)</p>
            <div className="grid grid-cols-3 gap-3">
              <div><label className="block text-xs text-slate-500 mb-1">Lidocaína (%)</label><input className={input} value={p.tumConc} onChange={e=>set("tumConc",e.target.value)} /></div>
              <div><label className="block text-xs text-slate-500 mb-1">Volume (mL)</label><input className={input} inputMode="numeric" value={p.tumVol} onChange={e=>set("tumVol",e.target.value)} /></div>
              <div><label className="block text-xs text-slate-500 mb-1">Teto (mg/kg)</label><input className={input} value={p.tumTeto} onChange={e=>set("tumTeto",e.target.value)} /></div>
            </div>
          </div>
        </div>
      </div>

      <div className="lg:col-span-5">
        <div className="space-y-4 lg:sticky lg:top-4">
          <div className="grid grid-cols-2 gap-3">
            <Meter title="STOP-BANG" big={p.idade===""?"—":stop.s} unit="/8" band={stop.band} segments={8} segActive={stop.s} note={stop.band.tone==="high"?"Investigar AOS / cautela na sedação.":null} />
            <Meter title="Lidocaína" big={last.ok?last.mgkg.toFixed(1):"—"} unit="mg/kg" band={last.ok?last.band:{label:"—",tone:"none"}} note={last.ok?"Couro cabeludo não remove gordura — não transpor teto da lipo.":"Informe %, volume e peso."} />
          </div>
          <div className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
            <label className="mb-3 flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" checked={usarBusca} onChange={e=>setUsarBusca(e.target.checked)} className="h-4 w-4 accent-teal-700" /> Confirmar diretrizes na fonte</label>
            <button onClick={gerar} disabled={!podeGerar} className="w-full rounded-md bg-teal-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-teal-800 disabled:bg-slate-300">{loading?"Gerando…":"Gerar avaliação"}</button>
            {!podeGerar&&!loading&&<p className="mt-2 text-xs text-slate-400">Informe ao menos idade e peso.</p>}
            {erro&&<p className="mt-3 rounded-md bg-red-50 px-3 py-2 text-xs text-red-700">{erro}</p>}
          </div>
          {laudo&&(
            <div className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
              {tag&&<div className={"mb-3 rounded-md border px-3 py-2 text-sm font-semibold "+tagCls}>Recomendação: {tag}</div>}
              <div className="space-y-1 text-sm leading-relaxed text-slate-700">{laudo.split("\n").map((ln,i)=>ln.startsWith("# ")?<h4 key={i} className="mt-3 text-[11px] font-semibold uppercase tracking-wider text-teal-700">{ln.slice(2)}</h4>:ln.trim()?<p key={i} className={ln.startsWith("-")?"pl-3 -indent-3":""}>{ln}</p>:<div key={i} className="h-1" />)}</div>
              <button onClick={salvar} className="mt-4 w-full rounded-md border border-teal-600 px-4 py-2 text-sm font-medium text-teal-700 hover:bg-teal-50">{salvo?"Salvo no histórico ✓":"Salvar no histórico"}</button>
            </div>
          )}
          <p className="px-1 text-[11px] leading-snug text-slate-400">Apoio à decisão gerado por IA. Confira cada conduta, confirme tempos de suspensão na diretriz vigente e registre a decisão final sob sua responsabilidade.</p>
        </div>
      </div>
    </div>
  );
}

function Historico() {
  const [casos,setCasos]=useState(null); const [aberto,setAberto]=useState(null);
  useEffect(()=>{ sb.from("casos").select("*").order("created_at",{ascending:false}).then(({data})=>setCasos(data||[])); },[]);
  if(casos===null) return <p className="text-sm text-slate-500">Carregando…</p>;
  if(casos.length===0) return <p className="text-sm text-slate-500">Nenhum caso salvo ainda. Gere uma avaliação e toque em "Salvar no histórico".</p>;
  return (
    <div className="space-y-3">
      {casos.map(c=>(
        <div key={c.id} className="rounded-lg border border-slate-200 bg-white p-4">
          <button onClick={()=>setAberto(aberto===c.id?null:c.id)} className="flex w-full items-center justify-between text-left">
            <span className="font-medium text-slate-800">{c.codigo} <span className="text-xs font-normal text-slate-400">· {c.idade||"?"}a · {new Date(c.created_at).toLocaleDateString("pt-BR")}</span></span>
            <span className="text-xs text-teal-700">{aberto===c.id?"fechar":"ver"}</span>
          </button>
          {aberto===c.id&&<div className="mt-3 whitespace-pre-wrap border-t border-slate-100 pt-3 text-sm text-slate-700">{c.laudo||"(sem laudo)"}</div>}
        </div>
      ))}
    </div>
  );
}

function App(){
  const [session,setSession]=useState(undefined); const [tab,setTab]=useState("nova");
  useEffect(()=>{ sb.auth.getSession().then(({data})=>setSession(data.session)); const { data:sub }=sb.auth.onAuthStateChange((_e,s)=>setSession(s)); return ()=>sub.subscription.unsubscribe(); },[]);
  if(session===undefined) return null;
  if(!session) return <Auth />;
  return (
    <div className="min-h-screen">
      <div className="h-1 w-full bg-teal-700"></div>
      <div className="mx-auto max-w-6xl px-4 py-5">
        <header className="mb-4 flex items-center justify-between">
          <div><h1 className="text-xl font-bold tracking-tight text-slate-900">Copiloto Pré-Op</h1><p className="text-xs text-slate-500">{session.user.email}</p></div>
          <button onClick={()=>sb.auth.signOut()} className="text-xs text-slate-500 hover:text-slate-700">Sair</button>
        </header>
        <div className="mb-5 flex gap-2">
          <button onClick={()=>setTab("nova")} className={"rounded-md px-3 py-1.5 text-sm "+(tab==="nova"?"bg-teal-700 text-white":"bg-white border border-slate-200 text-slate-600")}>Nova avaliação</button>
          <button onClick={()=>setTab("hist")} className={"rounded-md px-3 py-1.5 text-sm "+(tab==="hist"?"bg-teal-700 text-white":"bg-white border border-slate-200 text-slate-600")}>Histórico</button>
        </div>
        {tab==="nova"?<Avaliacao session={session} />:<Historico />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>

<script>
  // Compila o código acima com o runtime CLÁSSICO explícito (usa React.createElement,
  // sem injetar import) — elimina o conflito de runtime do Babel.
  (function () {
    try {
      var src = document.getElementById("appsrc").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(out);
    } catch (e) {
      var r = document.getElementById("root");
      if (r) r.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#b91c1c;font-size:14px">Erro ao iniciar: ' + (e && e.message ? e.message : e) + '</div>';
    }
  })();
</script>
</body>
